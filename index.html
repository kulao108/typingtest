<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>瑪利奧輔助字形打字系統 (分類題庫版)</title>
    <!-- 讀取題庫與帳號的必要工具 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; }
        h1, h2 { text-align: center; color: #333; }
        .panel { display: none; max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-student { background: #2196F3; color: white; }
        .btn-start { background: #e52521; color: white; width: 100%; padding: 15px; font-size: 20px; margin-top: 20px; }
        
        .login-box { text-align: center; max-width: 450px; margin: 50px auto; }
        .login-box input, .login-box select { width: 80%; padding: 10px; margin: 10px 0; font-size: 18px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }

        #loading-screen { text-align: center; margin-top: 50px; font-size: 20px; color: #555; }
        
        /* 遊戲介面 */
        #game-container { width: 800px; height: 350px; margin: 0 auto; background-color: #87CEEB; position: relative; border: 4px solid #333; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        #background { position: absolute; width: 200%; height: 100%; background-image: repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.3) 100px, rgba(255,255,255,0.3) 200px); bottom: 0; left: 0; z-index: 1; }
        #ground { position: absolute; bottom: 0; width: 100%; height: 60px; background-color: #8B4513; border-top: 6px solid #228B22; z-index: 3; }
        #player { font-size: 60px; position: absolute; bottom: 50px; left: 50px; z-index: 4; transition: bottom 0.15s ease-out, left 0.3s ease-out; }
        
        #question-box { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(255, 255, 255, 0.95); padding: 15px 30px; border-radius: 10px; border: 4px solid #333; text-align: center; transition: border-color 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .question-image img { max-width: 100px; max-height: 100px; border-radius: 5px; }
        #hud { display: flex; justify-content: space-between; padding: 10px 20px; font-size: 18px; font-weight: bold; background: #333; color: white; border-radius: 5px; width: 760px; margin: 0 auto 15px auto; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- 載入中畫面 -->
    <div id="loading-screen" class="panel" style="display: block;">
        <h2 id="loading-text">🔄 正在載入系統，請稍候...</h2>
    </div>

    <!-- 學生登入 -->
    <div id="student-login-panel" class="panel login-box">
        <h2>🍄 輔助字形學習系統</h2>
        <p style="color: green; font-weight: bold;">✅ 系統就緒！請登入</p>
        <input type="text" id="login-acc" placeholder="請輸入帳號">
        <input type="password" id="login-pw" placeholder="請輸入密碼">
        <button class="btn btn-student" onclick="loginStudent()" style="width: 80%;">登入系統</button>
        <div id="login-error" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- 練習設定面板 -->
    <div id="student-setup-panel" class="panel login-box">
        <h2>📚 測驗設定</h2>
        
        <div style="margin: 15px 0;">
            <span style="font-size: 18px; font-weight: bold;">📌 選擇類別：</span><br>
            <select id="category-select">
                <option value="cat1">哲理類</option>
                <option value="cat2">筆劃類</option>
                <option value="cat3">人身類</option>
                <option value="cat4">字形類</option>
                <option value="all">🌟 所有輔助字形 (綜合)</option>
            </select>
        </div>

        <div style="margin: 15px 0;">
            <span style="font-size: 18px; font-weight: bold;">⏳ 測驗限時：</span><br>
            <input type="number" id="practice-minutes" value="5" min="1" max="60" style="width: 100px; font-size: 20px;"> 分鐘
        </div>

        <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 20px; color: #2e7d32; text-align: left; font-size: 14px;">
            <b>📝 測驗規則：</b><br>
            1. 共 <b>100</b> 題，答錯不扣分直接跳過。<br>
            2. 連擊越快，角色跑越快！<br>
            3. 測驗結束後，成績會自動上傳。
        </div>
        <button class="btn btn-start" onclick="prepareGame()">▶️ 準備好，開始狂奔</button>
    </div>

    <!-- 遊戲介面 -->
    <div id="game-panel" class="panel" style="background: transparent; box-shadow: none; max-width: 1000px;">
        <h2 style="margin-top: 0;">🏃‍♂️‍➡ 玩家：<span id="current-player-name" style="color: #e52521;"></span> | 類別：<span id="current-cat-name" style="color:#2196F3;"></span></h2>
        <div id="hud">
            <div>倒數: <span id="time-display" style="color: #FFD700;">00:00</span></div>
            <div>進度: <span id="distance-display" style="color: #FFF;">0 / 100</span></div>
            <div>速度: <span id="speed-display" style="color: #00FFFF;">0</span> km/h</div>
            <div>得分: <span id="score-display" style="color: #00FF00;">0</span> 分</div>
        </div>
        
        <div id="game-container">
            <div id="background"></div><div id="ground"></div>
            <div id="player" style="left: 50px;">🏃‍♂️‍➡</div>
            <div id="question-box">
                <div class="question-image" id="current-image"></div>
                <div style="font-size: 16px; font-weight: bold; margin-top: 5px;">請輸入英文字母</div>
            </div>
        </div>
    </div>

    <script>
        let studentAccounts = {}; let questionBank = []; let currentLoggedInUser = ""; let currentCategoryText = "";
        const TOTAL_QUESTIONS = 100; 
        let questionsAttempted = 0, correctAnswers = 0, mistakes = 0;
        let totalSeconds = 0, timeLeft = 0, currentQuestionIndex = 0;
        let timerInterval, isPlaying = false, currentSpeed = 0, bgOffset = 0;

        // 當網頁打開，先只讀取 accounts.xlsx
        window.onload = async function() {
            try {
                const accRes = await fetch('./accounts.xlsx');
                if(!accRes.ok) throw new Error("Excel找不到");
                const accBuffer = await accRes.arrayBuffer();
                const workbook = XLSX.read(accBuffer, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                json.forEach(row => {
                    let accKey = Object.keys(row).find(key => key.includes("帳號") || key.includes("account"));
                    let pwKey = Object.keys(row).find(key => key.includes("密碼") || key.includes("password"));
                    if(accKey && pwKey) studentAccounts[String(row[accKey]).trim()] = String(row[pwKey]).trim();
                });

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('student-login-panel').style.display = 'block';
            } catch (error) {
                document.getElementById('loading-text').innerHTML = "❌ 載入失敗！<br>請確認 accounts.xlsx 是否存在且正確上傳。";
                document.getElementById('loading-text').style.color = "red";
            }
        };

        function showPanel(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
            document.getElementById(panelId).style.display = 'block';
        }

        function loginStudent() {
            const acc = document.getElementById('login-acc').value.trim();
            const pw = document.getElementById('login-pw').value.trim();
            if (studentAccounts[acc] && studentAccounts[acc] === pw) {
                currentLoggedInUser = acc;
                document.getElementById('current-player-name').innerText = acc;
                document.getElementById('login-error').innerText = '';
                showPanel('student-setup-panel');
            } else {
                document.getElementById('login-error').innerText = "帳號或密碼錯誤！";
            }
        }

        // 解析單一 ZIP 檔的共用函數
        async function loadZipData(zipFileName) {
            const zipRes = await fetch('./' + zipFileName);
            if(!zipRes.ok) throw new Error(zipFileName + " 找不到");
            const zipBlob = await zipRes.blob();
            const zipContent = await new JSZip().loadAsync(zipBlob);
            const promises = [];
            Object.keys(zipContent.files).forEach(function(filename) {
                const zipEntry = zipContent.files[filename];
                if (zipEntry.dir || !filename.match(/\.(jpg|jpeg|png|gif|bmp)$/i) || filename.includes("__MACOSX")) return;
                promises.push(zipEntry.async("base64").then(function(base64Data) {
                    const nameWithoutExt = filename.split('/').pop().split('.')[0]; 
                    const answer = nameWithoutExt.match(/^[a-zA-Z]+/)[0].toLowerCase();
                    let mimeType = filename.toLowerCase().endsWith('jpg') ? 'image/jpeg' : 'image/png';
                    questionBank.push({ answer: answer, imgSrc: `data:${mimeType};base64,` + base64Data });
                }));
            });
            await Promise.all(promises);
        }

        // 學生點擊開始後，根據類別去載入 ZIP
        async function prepareGame() {
            const catSelect = document.getElementById('category-select');
            const catValue = catSelect.value;
            currentCategoryText = catSelect.options[catSelect.selectedIndex].text;
            document.getElementById('current-cat-name').innerText = currentCategoryText;

            showPanel('loading-screen');
            document.getElementById('loading-text').innerText = `🔄 正在載入 [${currentCategoryText}] 題庫，請稍候...`;
            document.getElementById('loading-text').style.color = "#555";
            
            questionBank = []; // 清空舊題庫

            try {
                if (catValue === 'all') {
                    // 同時載入 4 個 ZIP
                    await Promise.all([
                        loadZipData('cat1.zip'), loadZipData('cat2.zip'),
                        loadZipData('cat3.zip'), loadZipData('cat4.zip')
                    ]);
                } else {
                    // 載入指定的 ZIP (例如 cat1.zip)
                    await loadZipData(catValue + '.zip');
                }

                if (questionBank.length === 0) throw new Error("題庫內沒有圖片！");
                
                // 載入成功，正式開始遊戲
                startGame();
            } catch (error) {
                alert("載入題庫發生錯誤：" + error.message + "\n請確認老師是否已經上傳對應的 ZIP 檔案。");
                showPanel('student-setup-panel');
            }
        }

        function formatTime(s) { let m=Math.floor(s/60), sec=s%60; return (m<10?"0"+m:m)+":"+(sec<10?"0"+sec:sec); }

        function startGame() {
            timeLeft = (parseInt(document.getElementById('practice-minutes').value) || 5) * 60;
            showPanel('game-panel');
            document.getElementById('question-box').style.display = 'block';
            questionBank.sort(() => Math.random() - 0.5);
            questionsAttempted = 0; correctAnswers = 0; mistakes = 0; 
            currentQuestionIndex = 0; currentSpeed = 0; bgOffset = 0; isPlaying = true;
            document.getElementById('player').style.left = '50px';

            updateHUD(); showNextQuestion(); requestAnimationFrame(gameLoop);

            timerInterval = setInterval(() => {
                timeLeft--; updateHUD();
                if (timeLeft <= 0) endGame(false); 
            }, 1000);
        }

        function showNextQuestion() {
            currentQuestionIndex = Math.floor(Math.random() * questionBank.length);
            document.getElementById('current-image').innerHTML = `<img src="${questionBank[currentQuestionIndex].imgSrc}">`;
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            const userInput = e.key.toLowerCase();
            const correctAnswer = questionBank[currentQuestionIndex].answer;
            questionsAttempted++; 

            if (userInput === correctAnswer) {
                correctAnswers++;
                currentSpeed = Math.min(40, currentSpeed + 12); 
                document.getElementById('player').style.left = (50 + (correctAnswers / TOTAL_QUESTIONS) * 650) + 'px';
                document.getElementById('player').style.bottom = '90px';
                setTimeout(() => document.getElementById('player').style.bottom = '50px', 150);
            } else {
                mistakes++;
                currentSpeed = Math.max(0, currentSpeed - 10); 
                document.getElementById('question-box').style.borderColor = "red";
                setTimeout(() => document.getElementById('question-box').style.borderColor = "#333", 200);
            }
            updateHUD();
            if (questionsAttempted >= TOTAL_QUESTIONS) endGame(true); else showNextQuestion();
        });

        function gameLoop() {
            if (!isPlaying) return;
            currentSpeed *= 0.95; bgOffset -= currentSpeed;
            if (bgOffset <= -800) bgOffset = 0;
            document.getElementById('background').style.transform = `translateX(${bgOffset}px)`;
            document.getElementById('speed-display').innerText = Math.floor(currentSpeed * 3);
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('time-display').innerText = formatTime(timeLeft);
            document.getElementById('distance-display').innerText = `${questionsAttempted} / 100`;
            document.getElementById('score-display').innerText = correctAnswers; 
        }

        // =======================================================================
        // ⚠️ 請把下方引號內的網址，換成你的 Google Apps Script 網址！ 
        // =======================================================================
        const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbws7f2URyNrWJf8uoYn2YveI0WEYKn0GmkuzYM6KgRiZUpAS-JCsyxaFhc0wS-QNPURaw/exec";

        function endGame(isFinishedAll) {
            isPlaying = false; clearInterval(timerInterval);
            let title = isFinishedAll ? `<h2 style="color:#4CAF50;">🎉 完成測驗！</h2>` : `<h2 style="color:#e52521;">⏳ 時間到！</h2>`;
            
            document.getElementById('question-box').innerHTML = `
                ${title}
                <div style="font-size:16px; margin-bottom:10px;">類別：<b>${currentCategoryText}</b></div>
                <div style="font-size:18px;">答對：${correctAnswers} 題 | 答錯：${mistakes} 題</div>
                <div style="font-size:26px; font-weight:bold; margin:10px 0;">得分：${correctAnswers} 分</div>
                <div id="upload-status" style="color: #FF9800; font-weight: bold; margin-top:10px;">⏳ 正在將成績傳送給老師，請稍候...</div>
                <button onclick="location.reload()" style="margin-top:15px; padding:10px;">回首頁</button>
            `;
            document.getElementById('question-box').style.width = "400px";

            // 傳送資料到 Google Sheet，這次包含了 category 欄位
            fetch(GOOGLE_SHEET_API, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    date: new Date().toLocaleString(),
                    account: currentLoggedInUser,
                    category: currentCategoryText, // 上傳這次練習的類別
                    progress: isFinishedAll ? "✅ 提早完成" : "⏳ 時間到",
                    correct: correctAnswers,
                    mistakes: mistakes
                })
            }).then(() => {
                document.getElementById('upload-status').innerHTML = "✅ 成績已成功傳送！";
                document.getElementById('upload-status').style.color = "green";
            }).catch((err) => {
                document.getElementById('upload-status').innerHTML = "❌ 網路問題傳送失敗，請截圖給老師。";
            });
        }
    </script>
</body>
</html>
