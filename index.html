  <script>


    // ==============================================================
    // 目前正式 Apps Script /exec
    // ==============================================================

    const GAS_WEB_APP_URL =

      "https://script.google.com/macros/s/AKfycbxRGHiGaU1zOl043Y_rn63Se43m2Du38D-w-K_OmmNuk2ASLQIaiL1U-aJVtORH-vTs/exec";


    const APP_VERSION =
      "3.0.0";


    const TOTAL_QUESTIONS =
      100;


    const GAS_FRAME_NAME =
      "gas-response-frame";


    // ==============================================================
    // 狀態
    // ==============================================================

    let questionBank =
      [];


    let currentStudent =
      null;


    let sessionToken =
      "";


    let currentCategoryText =
      "";


    let questionsAttempted =
      0;


    let correctAnswers =
      0;


    let mistakes =
      0;


    let totalSeconds =
      0;


    let timeLeft =
      0;


    let currentQuestionIndex =
      0;


    let timerInterval =
      null;


    let isPlaying =
      false;


    let currentSpeed =
      0;


    let bgOffset =
      0;


    let requestCounter =
      0;


    const pendingRequests =
      new Map();


    const clientNonce =
      createClientNonce();


    // ==============================================================
    // 啟動
    // ==============================================================

    window.addEventListener(

      'load',

      initSystem

    );


    window.addEventListener(

      'message',

      handleAppsScriptMessage

    );


    document

      .getElementById(
        'login-pw'
      )

      .addEventListener(

        'keydown',

        event => {

          if (
            event.key ===
            'Enter'
          ) {

            loginStudent();

          }

        }

      );


    // ==============================================================
    // 初始化
    // ==============================================================

    async function initSystem() {


      if (

        !GAS_WEB_APP_URL.startsWith(
          'https://script.google.com/macros/s/'
        )

        ||

        !GAS_WEB_APP_URL.endsWith(
          '/exec'
        )

      ) {


        showSystemError(

          'Apps Script 網址設定錯誤。',

          'GAS_WEB_APP_URL 必須是正式部署的 /exec 網址。'

        );


        return;

      }


      try {


        const result =

          await postToAppsScript(

            'ping',

            {},

            15000

          );


        if (

          !result ||

          !result.success

        ) {


          throw new Error(

            result &&
            result.message

              ? result.message

              : '後端未回覆成功狀態'

          );

        }


        showPanel(

          'student-login-panel'

        );


      }

      catch (err) {


        showSystemError(

          '未能連接 Google Apps Script。',

          '原因：' +
          err.message +
          '。請確認 Apps Script 已更新部署為新版本，並設定「執行身分：我」、「誰可以存取：任何人」。'

        );

      }

    }


    // ==============================================================
    // POST 通訊
    // ==============================================================

    function createClientNonce() {


      if (

        window.crypto &&

        typeof window.crypto.randomUUID ===
        'function'

      ) {


        return window.crypto.randomUUID();

      }


      return (

        Date.now()
          .toString(36)

        +

        '-'

        +

        Math.random()
          .toString(36)
          .slice(2)

        +

        '-'

        +

        Math.random()
          .toString(36)
          .slice(2)

      );

    }


    function isTrustedAppsScriptOrigin(
      origin
    ) {


      if (
        origin ===
        'null'
      ) {

        return true;

      }


      try {


        const host =

          new URL(
            origin
          ).hostname;


        return (

          host ===
          'script.google.com'

          ||

          host ===
          'script.googleusercontent.com'

          ||

          host.endsWith(
            '.googleusercontent.com'
          )

        );


      }

      catch (err) {

        return false;

      }

    }


    function handleAppsScriptMessage(
      event
    ) {


      const msg =
        event.data ||
        {};


      if (

        msg.channel !==
        'typing-game-post'

      ) {

        return;

      }


      if (

        msg.clientNonce !==
        clientNonce

      ) {

        return;

      }


      if (

        !isTrustedAppsScriptOrigin(
          event.origin
        )

      ) {

        return;

      }


      if (

        !msg.requestId ||

        !pendingRequests.has(
          msg.requestId
        )

      ) {

        return;

      }


      const pending =

        pendingRequests.get(
          msg.requestId
        );


      pendingRequests.delete(
        msg.requestId
      );


      clearTimeout(
        pending.timer
      );


      if (
        msg.ok
      ) {


        pending.resolve(
          msg.result
        );


      }

      else {


        pending.reject(

          new Error(

            msg.error ||

            'Apps Script 發生未知錯誤'

          )

        );

      }

    }


    function postToAppsScript(

      action,

      payload,

      timeoutMs =
        15000

    ) {


      return new Promise(

        (
          resolve,
          reject
        ) => {


          const requestId =

            'req-'

            +

            Date.now()

            +

            '-'

            +

            (++requestCounter);


          const timer =

            setTimeout(

              () => {


                pendingRequests.delete(
                  requestId
                );


                reject(

                  new Error(
                    'Apps Script 回應逾時'
                  )

                );


              },

              timeoutMs

            );


          pendingRequests.set(

            requestId,

            {

              resolve,

              reject,

              timer

            }

          );


          const form =

            document.createElement(
              'form'
            );


          form.method =
            'POST';


          form.action =
            GAS_WEB_APP_URL;


          form.target =
            GAS_FRAME_NAME;


          form.style.display =
            'none';


          addHiddenField(

            form,

            'action',

            action

          );


          addHiddenField(

            form,

            'requestId',

            requestId

          );


          addHiddenField(

            form,

            'clientNonce',

            clientNonce

          );


          addHiddenField(

            form,

            'payload',

            JSON.stringify(
              payload ||
              {}
            )

          );


          document.body.appendChild(
            form
          );


          try {


            form.submit();


          }

          catch (err) {


            clearTimeout(
              timer
            );


            pendingRequests.delete(
              requestId
            );


            reject(
              err
            );


          }

          finally {


            form.remove();


          }

        }

      );

    }


    function addHiddenField(

      form,

      name,

      value

    ) {


      const input =

        document.createElement(
          'input'
        );


      input.type =
        'hidden';


      input.name =
        name;


      input.value =

        String(

          value == null
            ? ''
            : value

        );


      form.appendChild(
        input
      );

    }


    // ==============================================================
    // 畫面
    // ==============================================================

    function showSystemError(

      title,

      detail

    ) {


      showPanel(
        'loading-screen'
      );


      const text =

        document.getElementById(
          'loading-text'
        );


      text.textContent =

        '❌ ' +
        title;


      text.style.color =
        'red';


      document.getElementById(
        'loading-detail'
      ).textContent =

        detail ||
        '';

    }


    function showPanel(
      panelId
    ) {


      document

        .querySelectorAll(
          '.panel'
        )

        .forEach(

          panel => {


            panel.style.display =
              'none';


          }

        );


      document.getElementById(
        panelId
      ).style.display =
        'block';

    }


    // ==============================================================
    // 登入
    // ==============================================================

    async function loginStudent() {


      const acc =

        document

          .getElementById(
            'login-acc'
          )

          .value

          .trim();


      const pw =

        document

          .getElementById(
            'login-pw'
          )

          .value;


      const errorBox =

        document.getElementById(
          'login-error'
        );


      const button =

        document.getElementById(
          'login-button'
        );


      if (
        !acc ||
        !pw
      ) {


        errorBox.textContent =
          '請輸入帳號及密碼。';


        return;

      }


      errorBox.textContent =
        '';


      button.disabled =
        true;


      button.textContent =
        '登入中...';


      try {


        const result =

          await postToAppsScript(

            'login',

            {

              account:
                acc,

              password:
                pw

            },

            15000

          );


        if (

          !result ||

          !result.success

        ) {


          errorBox.textContent =

            result &&
            result.message

              ? result.message

              : '帳號或密碼錯誤。';


          return;

        }


        currentStudent =
          result.student;


        sessionToken =
          result.sessionToken;


        document.getElementById(
          'setup-student-name'
        ).textContent =

          currentStudent.name ||

          currentStudent.account;


        document.getElementById(
          'setup-student-class'
        ).textContent =

          currentStudent.className ||

          '未設定';


        document.getElementById(
          'setup-student-no'
        ).textContent =

          currentStudent.studentNo ||

          '—';


        document.getElementById(
          'setup-student-no-row'
        ).style.display =

          currentStudent.studentNo

            ? 'block'

            : 'none';


        document.getElementById(
          'current-player-name'
        ).textContent =

          currentStudent.name ||

          currentStudent.account;


        document.getElementById(
          'current-player-class'
        ).textContent =

          currentStudent.className ||

          '未設定';


        document.getElementById(
          'login-pw'
        ).value =
          '';


        showPanel(
          'student-setup-panel'
        );


      }

      catch (err) {


        errorBox.textContent =

          '登入失敗：'

          +

          err.message;


      }

      finally {


        button.disabled =
          false;


        button.textContent =
          '登入系統';


      }

    }


    // ==============================================================
    // 題庫
    // ==============================================================

    async function loadZipData(
      zipFileName
    ) {


      const zipRes =

        await fetch(

          './' +
          zipFileName,

          {

            cache:
              'no-cache'

          }

        );


      if (
        !zipRes.ok
      ) {


        throw new Error(

          zipFileName +

          ' 找不到'

        );

      }


      const zipBlob =
        await zipRes.blob();


      const zipContent =

        await new JSZip()

          .loadAsync(
            zipBlob
          );


      const promises =
        [];


      Object.keys(

        zipContent.files

      ).forEach(

        filename => {


          const zipEntry =

            zipContent.files[
              filename
            ];


          if (

            zipEntry.dir

            ||

            !filename.match(
              /\.(jpg|jpeg|png|gif|bmp|webp)$/i
            )

            ||

            filename.includes(
              '__MACOSX'
            )

          ) {


            return;

          }


          const shortName =

            filename

              .split('/')

              .pop();


          const nameWithoutExt =

            shortName.replace(

              /\.[^.]+$/,

              ''

            );


          const answerMatch =

            nameWithoutExt.match(
              /^[a-zA-Z]+/
            );


          if (
            !answerMatch
          ) {

            return;

          }


          promises.push(


            zipEntry

              .async(
                'base64'
              )

              .then(

                base64Data => {


                  const ext =

                    (

                      shortName

                        .split('.')

                        .pop()

                      ||

                      ''

                    )

                      .toLowerCase();


                  const mimeMap = {

                    jpg:
                      'image/jpeg',

                    jpeg:
                      'image/jpeg',

                    png:
                      'image/png',

                    gif:
                      'image/gif',

                    bmp:
                      'image/bmp',

                    webp:
                      'image/webp'

                  };


                  questionBank.push({

                    answer:

                      answerMatch[0]

                        .toLowerCase(),


                    imgSrc:

                      `data:${

                        mimeMap[ext]

                        ||

                        'image/png'

                      };base64,${base64Data}`

                  });

                }

              )

          );

        }

      );


      await Promise.all(
        promises
      );

    }


    async function prepareGame() {


      if (

        !currentStudent ||

        !sessionToken

      ) {


        alert(
          '登入狀態已失效，請重新登入。'
        );


        location.reload();


        return;

      }


      const catSelect =

        document.getElementById(
          'category-select'
        );


      const catValue =
        catSelect.value;


      currentCategoryText =

        catSelect.options[

          catSelect.selectedIndex

        ].text;


      document.getElementById(
        'current-cat-name'
      ).textContent =

        currentCategoryText;


      showPanel(
        'loading-screen'
      );


      document.getElementById(
        'loading-text'
      ).textContent =

        `🔄 正在載入「${currentCategoryText}」題庫，請稍候...`;


      document.getElementById(
        'loading-text'
      ).style.color =
        '#555';


      document.getElementById(
        'loading-detail'
      ).textContent =
        '';


      questionBank =
        [];


      try {


        if (
          catValue ===
          'all'
        ) {


          await Promise.all([

            loadZipData(
              'cat1.zip'
            ),

            loadZipData(
              'cat2.zip'
            ),

            loadZipData(
              'cat3.zip'
            ),

            loadZipData(
              'cat4.zip'
            )

          ]);


        }

        else {


          await loadZipData(

            catValue +
            '.zip'

          );

        }


        if (

          questionBank.length ===
          0

        ) {


          throw new Error(
            '題庫內沒有可用圖片'
          );

        }


        startGame();


      }

      catch (err) {


        alert(

          '載入題庫發生錯誤：'

          +

          err.message

          +

          '\n請確認 GitHub 已上傳對應的 ZIP 檔案。'

        );


        showPanel(
          'student-setup-panel'
        );

      }

    }


    // ==============================================================
    // 遊戲
    // ==============================================================

    function formatTime(
      seconds
    ) {


      const s =

        Math.max(

          0,

          Number(seconds) ||
          0

        );


      const m =

        Math.floor(
          s /
          60
        );


      const sec =
        s %
        60;


      return (

        String(m)
          .padStart(
            2,
            '0'
          )

        +

        ':'

        +

        String(sec)
          .padStart(
            2,
            '0'
          )

      );

    }


    function startGame() {


      const minutes =

        Math.min(

          60,

          Math.max(

            1,

            parseInt(

              document

                .getElementById(
                  'practice-minutes'
                )

                .value,

              10

            )

            ||

            5

          )

        );


      totalSeconds =
        minutes *
        60;


      timeLeft =
        totalSeconds;


      showPanel(
        'game-panel'
      );


      const qBox =

        document.getElementById(
          'question-box'
        );


      qBox.style.display =
        'block';


      qBox.style.width =
        '';


      qBox.style.borderColor =
        '#333';


      questionBank.sort(

        () =>
          Math.random() -
          0.5

      );


      questionsAttempted =
        0;


      correctAnswers =
        0;


      mistakes =
        0;


      currentQuestionIndex =
        0;


      currentSpeed =
        0;


      bgOffset =
        0;


      isPlaying =
        true;


      document.getElementById(
        'player'
      ).style.left =
        '50px';


      updateHUD();


      showNextQuestion();


      requestAnimationFrame(
        gameLoop
      );


      clearInterval(
        timerInterval
      );


      timerInterval =

        setInterval(

          () => {


            timeLeft--;


            updateHUD();


            if (
              timeLeft <=
              0
            ) {


              endGame(
                false
              );

            }

          },

          1000

        );

    }


    function showNextQuestion() {


      currentQuestionIndex =

        Math.floor(

          Math.random()

          *

          questionBank.length

        );


      document.getElementById(
        'current-image'
      ).innerHTML =

        `<img src="${

          questionBank[
            currentQuestionIndex
          ].imgSrc

        }" alt="題目圖片">`;

    }


    window.addEventListener(

      'keydown',

      event => {


        if (
          !isPlaying
        ) {

          return;

        }


        const userInput =

          event.key

            .toLowerCase();


        // 只接受單一 a-z

        if (

          !/^[a-z]$/.test(
            userInput
          )

        ) {

          return;

        }


        const correctAnswer =

          questionBank[
            currentQuestionIndex
          ].answer;


        questionsAttempted++;


        if (

          userInput ===
          correctAnswer

        ) {


          correctAnswers++;


          currentSpeed =

            Math.min(

              40,

              currentSpeed +
              12

            );


          document.getElementById(
            'player'
          ).style.left =

            (

              50

              +

              (

                correctAnswers

                /

                TOTAL_QUESTIONS

              )

              *

              650

            )

            +

            'px';


          document.getElementById(
            'player'
          ).style.bottom =
            '90px';


          setTimeout(

            () => {


              document.getElementById(
                'player'
              ).style.bottom =
                '50px';


            },

            150

          );


        }

        else {


          mistakes++;


          currentSpeed =

            Math.max(

              0,

              currentSpeed -
              10

            );


          document.getElementById(
            'question-box'
          ).style.borderColor =
            'red';


          setTimeout(

            () => {


              document.getElementById(
                'question-box'
              ).style.borderColor =
                '#333';


            },

            200

          );

        }


        updateHUD();


        if (

          questionsAttempted >=
          TOTAL_QUESTIONS

        ) {


          endGame(
            true
          );


        }

        else {


          showNextQuestion();


        }

      }

    );


    function gameLoop() {


      if (
        !isPlaying
      ) {

        return;

      }


      currentSpeed *=
        0.95;


      bgOffset -=
        currentSpeed;


      if (
        bgOffset <=
        -800
      ) {


        bgOffset =
          0;

      }


      document.getElementById(
        'background'
      ).style.transform =

        `translateX(${bgOffset}px)`;


      document.getElementById(
        'speed-display'
      ).textContent =

        Math.floor(

          currentSpeed *
          3

        );


      requestAnimationFrame(
        gameLoop
      );

    }


    function updateHUD() {


      document.getElementById(
        'time-display'
      ).textContent =

        formatTime(
          timeLeft
        );


      document.getElementById(
        'distance-display'
      ).textContent =

        `${questionsAttempted} / ${TOTAL_QUESTIONS}`;


      document.getElementById(
        'score-display'
      ).textContent =

        correctAnswers;

    }


    // ==============================================================
    // 結束及上傳成績
    // ==============================================================

    async function endGame(
      isFinishedAll
    ) {


      if (
        !isPlaying
      ) {

        return;

      }


      isPlaying =
        false;


      clearInterval(
        timerInterval
      );


      const statusText =

        isFinishedAll

          ? '✅ 完成100題'

          : '⏳ 時間到';


      const title =

        isFinishedAll

          ? '<h2 style="color:#4CAF50;">🎉 完成測驗！</h2>'

          : '<h2 style="color:#e52521;">⏳ 時間到！</h2>';


      const safeName =

        escapeHtml(

          currentStudent.name

          ||

          currentStudent.account

        );


      const safeClass =

        escapeHtml(

          currentStudent.className

          ||

          '未設定班別'

        );


      const safeCategory =

        escapeHtml(
          currentCategoryText
        );


      document.getElementById(
        'question-box'
      ).innerHTML = `


        ${title}


        <div
          style="
            font-size:16px;
            margin-bottom:8px;
          ">

          ${safeName}

          （${safeClass}）

        </div>


        <div
          style="
            font-size:16px;
            margin-bottom:10px;
          ">

          類別：

          <b>
            ${safeCategory}
          </b>

        </div>


        <div
          style="font-size:18px;">

          答對：
          ${correctAnswers}
          題

          ｜

          答錯：
          ${mistakes}
          題

        </div>


        <div
          style="
            font-size:26px;
            font-weight:bold;
            margin:10px 0;
          ">

          得分：
          ${correctAnswers}
          分

        </div>


        <div

          id="upload-status"

          style="
            color:#FF9800;
            font-weight:bold;
            margin-top:10px;
          ">

          ⏳ 正在將成績傳送給老師...

        </div>


        <button

          onclick="location.reload()"

          style="
            margin-top:15px;
            padding:10px 18px;
          ">

          回首頁

        </button>

      `;


      document.getElementById(
        'question-box'
      ).style.width =
        '440px';


      const timeUsed =

        Math.max(

          0,

          totalSeconds

          -

          Math.max(
            0,
            timeLeft
          )

        );


      try {


        const result =

          await postToAppsScript(

            'saveResult',

            {

              sessionToken:
                sessionToken,


              result: {


                category:
                  currentCategoryText,


                status:
                  statusText,


                correct:
                  correctAnswers,


                mistakes:
                  mistakes,


                attempted:
                  questionsAttempted,


                timeLimitSeconds:
                  totalSeconds,


                timeUsedSeconds:
                  timeUsed,


                appVersion:
                  APP_VERSION

              }

            },

            20000

          );


        const status =

          document.getElementById(
            'upload-status'
          );


        if (

          result &&

          result.success

        ) {


          status.textContent =
            '✅ 成績已成功寫入老師的 Google Sheet！';


          status.style.color =
            'green';


        }

        else {


          throw new Error(

            result &&
            result.message

              ? result.message

              : '伺服器未確認寫入成功'

          );

        }


      }

      catch (err) {


        const status =

          document.getElementById(
            'upload-status'
          );


        status.textContent =

          '❌ 成績傳送失敗：'

          +

          err.message

          +

          '。請截圖交給老師。';


        status.style.color =
          'red';

      }

    }


    function escapeHtml(
      value
    ) {


      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


  </script>
